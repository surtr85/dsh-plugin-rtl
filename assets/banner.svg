<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Deep Turquoise-Night & Indigo Gradient -->
    <radialGradient id="turquoise-night-c" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08222a" />
      <stop offset="50%" stop-color="#04141a" />
      <stop offset="100%" stop-color="#020b0e" />
    </radialGradient>

    <!-- Persian Turquoise Gradient -->
    <linearGradient id="turquoise-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="80%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#045650" />
    </linearGradient>

    <!-- Warm Terracotta & Saffron Gradient -->
    <linearGradient id="saffron-clay-c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e07a5f" />
      <stop offset="50%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e9c46a" />
    </linearGradient>

    <!-- Soft Cream Gradient -->
    <linearGradient id="cream-ivory-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f0e6" />
      <stop offset="100%" stop-color="#ded6c5" />
    </linearGradient>

    <!-- Authentic Isfahan Girih Hexagonal Lattice Pattern -->
    <pattern id="isfahan-hex-lattice" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 36,0 L 72,18 L 72,54 L 36,72 L 0,54 L 0,18 Z" fill="none" stroke="#14b8a6" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="36" cy="36" r="6" fill="none" stroke="#f4a261" stroke-width="0.6" stroke-opacity="0.08" />
      <line x1="0" y1="18" x2="72" y2="54" stroke="#14b8a6" stroke-width="0.4" stroke-opacity="0.05" />
      <line x1="72" y1="18" x2="0" y2="54" stroke="#14b8a6" stroke-width="0.4" stroke-opacity="0.05" />
    </pattern>

    <filter id="turquoise-glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#turquoise-night-c)" />
  <rect width="1200" height="500" fill="url(#isfahan-hex-lattice)" />

  <!-- Authentic Persian Double Border (جدول‌کشی فیروزه‌ای و خشتی) -->
  <rect x="22" y="22" width="1156" height="456" rx="4" fill="none" stroke="url(#turquoise-c)" stroke-width="1.8" stroke-opacity="0.7" />
  <rect x="30" y="30" width="1140" height="440" rx="2" fill="none" stroke="url(#saffron-clay-c)" stroke-width="0.8" stroke-opacity="0.6" />
  <rect x="36" y="36" width="1128" height="428" rx="2" fill="none" stroke="url(#turquoise-c)" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="4,4" />

  <!-- Corner Tile Insets (گوشه‌سازی‌های ترنج) -->
  <g fill="url(#turquoise-c)" opacity="0.8">
    <path d="M 22,22 L 54,22 C 38,38 30,50 22,66 Z" />
    <path d="M 1178,22 L 1146,22 C 1162,38 1170,50 1178,66 Z" />
    <path d="M 22,478 L 54,478 C 38,462 30,450 22,434 Z" />
    <path d="M 1178,478 L 1146,478 C 1162,462 1170,450 1178,434 Z" />
  </g>

  <!-- ========================================================================
       Left Side: 12-Point Isfahan Turquoise Medallion (ترنج دوازده‌پر کاشی معرق)
       ======================================================================== -->
  <g id="turquoise-medallion">
    <!-- Ambient Teal Glow -->
    <circle cx="300" cy="250" r="205" fill="#14b8a6" fill-opacity="0.05" filter="url(#turquoise-glow-c)" />

    <!-- Outer 12-Point Rosette -->
    <polygon points="300.0,75.0 337.5,109.9 387.5,98.4 402.5,147.5 451.6,162.5 440.1,212.5 475.0,250.0 440.1,287.5 451.6,337.5 402.5,352.5 387.5,401.6 337.5,390.1 300.0,425.0 262.5,390.1 212.5,401.6 197.5,352.5 148.4,337.5 159.9,287.5 125.0,250.0 159.9,212.5 148.4,162.5 197.5,147.5 212.5,98.4 262.5,109.9" fill="#03171d" stroke="url(#turquoise-c)" stroke-width="2.2" />

    <!-- Mid Saffron-Clay Rosette -->
    <polygon points="300.0,112.0 330.5,136.0 369.0,130.5 383.4,166.6 419.5,181.0 414.0,219.5 438.0,250.0 414.0,280.5 419.5,319.0 383.4,333.4 369.0,369.5 330.5,364.0 300.0,388.0 269.5,364.0 231.0,369.5 216.6,333.4 180.5,319.0 186.0,280.5 162.0,250.0 186.0,219.5 180.5,181.0 216.6,166.6 231.0,130.5 269.5,136.0" fill="#05232b" stroke="url(#saffron-clay-c)" stroke-width="1.6" />

    <!-- Concentric Turquoise Rings -->
    <circle cx="300" cy="250" r="106" fill="none" stroke="url(#turquoise-c)" stroke-width="1" />
    <circle cx="300" cy="250" r="98" fill="none" stroke="url(#saffron-clay-c)" stroke-width="0.8" stroke-dasharray="3,3" />

    <!-- Inner 6-Point Hexagram in Warm Clay -->
    <polygon points="300.0,162.0 331.0,196.3 376.2,206.0 362.0,250.0 376.2,294.0 331.0,303.7 300.0,338.0 269.0,303.7 223.8,294.0 238.0,250.0 223.8,206.0 269.0,196.3" fill="#082e38" stroke="url(#saffron-clay-c)" stroke-width="1.8" />

    <!-- Core Geometric Star Diamond -->
    <g transform="translate(300, 250) rotate(45)">
      <rect x="-16" y="-16" width="32" height="32" fill="#021217" stroke="url(#turquoise-c)" stroke-width="2" rx="2" />
      <rect x="-10" y="-10" width="20" height="20" fill="url(#saffron-clay-c)" rx="1" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- 12 Concentric Pearl Nodes on Perimeter -->
    <g fill="url(#saffron-clay-c)">
      <circle cx="300" cy="65" r="3.5" />
      <circle cx="300" cy="435" r="3.5" />
      <circle cx="115" cy="250" r="3.5" />
      <circle cx="485" cy="250" r="3.5" />
      <circle cx="208" cy="90" r="3" />
      <circle cx="392" cy="90" r="3" />
      <circle cx="208" cy="410" r="3" />
      <circle cx="392" cy="410" r="3" />
    </g>
  </g>

  <!-- ========================================================================
       Right Side: Pure Persian Right-to-Left Typography (راست‌چین واقعی)
       ======================================================================== -->
  <g id="persian-typography-panel-c">
    <!-- Top Tablet / Sarlowh (کتیبه سرلوحه فیروزه‌فام) -->
    <g transform="translate(830, 70)">
      <rect x="0" y="0" width="290" height="30" rx="3" fill="#06232c" stroke="url(#turquoise-c)" stroke-width="1.2" />
      <polygon points="14,15 18,11 22,15 18,19" fill="#f4a261" />
      <text x="145" y="20" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="12" font-weight="bold" fill="#5eead4" text-anchor="middle">
        پـلاگـیـن رسـمـی زبـان و خـط پـارسـی
      </text>
      <polygon points="276,15 272,11 268,15 272,19" fill="#f4a261" />
    </g>

    <!-- Master Persian Title: Right Aligned -->
    <text x="1120" y="156" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="42" font-weight="900" fill="url(#cream-ivory-c)" text-anchor="end">
      خـطّ خـوش و چـیـدمـان راسـت‌بـه‌چـپ
    </text>

    <!-- Decorative Turquoise & Saffron Underline -->
    <path d="M 1120,174 L 620,174" stroke="url(#turquoise-c)" stroke-width="2" stroke-linecap="round" />
    <path d="M 610,174 L 560,174" stroke="url(#saffron-clay-c)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4,4" />

    <!-- Project Identifier & Version -->
    <g transform="translate(1120, 218)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800" fill="#5eead4" text-anchor="end" letter-spacing="-0.5">
        dsh-plugin-rtl
      </text>
      <text x="-240" y="-2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f4a261" text-anchor="end">
        // v1.0.0 STABLE
      </text>
    </g>

    <!-- Explanatory Persian Description: Two Perfectly Spaced Lines -->
    <text x="1120" y="262" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" text-anchor="end">
      سازگاری کامل با ادیتور پرامپت، ایزولاسیون واژگان انگلیسی و تایپوگرافی وزیرمتن
    </text>
    <text x="1120" y="292" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="end">
      طراحی‌شده برای هسته ماژولار کوردیس و هماهنگی کامل با تمام تم‌های دیپ‌سیک
    </text>

    <!-- Three Cultural Feature Badges (Aligned from Right to Left) -->
    <g id="feature-pills-c" transform="translate(1120, 322)">
      <!-- Badge 1: فونت اصیل وزیرمتن (Rightmost) -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="155" height="34" rx="4" fill="#052028" stroke="url(#turquoise-c)" stroke-width="1" />
        <circle cx="18" cy="17" r="3.5" fill="#5eead4" />
        <text x="85" y="22" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="12.5" font-weight="bold" fill="#e2fdf5" text-anchor="middle">
          فونت اصیل وزیرمتن
        </text>
      </g>

      <!-- Badge 2: استاندارد جهانی BiDi (Center) -->
      <g transform="translate(-325, 0)">
        <rect x="0" y="0" width="155" height="34" rx="4" fill="#1e1614" stroke="url(#saffron-clay-c)" stroke-width="1" />
        <circle cx="18" cy="17" r="3.5" fill="#f4a261" />
        <text x="85" y="22" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="12.5" font-weight="bold" fill="#fff7ed" text-anchor="middle">
          استاندارد جهانی BiDi
        </text>
      </g>

      <!-- Badge 3: سازگار با تم کلود (Leftmost) -->
      <g transform="translate(-495, 0)">
        <rect x="0" y="0" width="155" height="34" rx="4" fill="#052028" stroke="url(#turquoise-c)" stroke-width="1" />
        <circle cx="18" cy="17" r="3.5" fill="#5eead4" />
        <text x="85" y="22" font-family="'IRANYekan', 'Vazirmatn', sans-serif" font-size="12.5" font-weight="bold" fill="#e2fdf5" text-anchor="middle">
          سازگار با تم Claude
        </text>
      </g>
    </g>

    <!-- Terminal Install Box (کادر عریض و بدون هیچ‌گونه بیرون‌زدگی) -->
    <!-- Box width is 675px, text length is 440px -> 235px ample margin! -->
    <g transform="translate(445, 385)">
      <rect x="0" y="0" width="675" height="42" rx="5" fill="#020f14" stroke="url(#turquoise-c)" stroke-width="1" stroke-opacity="0.6" />
      <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#f4a261">❯</text>
      <text x="42" y="26" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="500" fill="#f8fafc">
        dsh plugin install https://github.com/surtr85/dsh-plugin-rtl
      </text>
    </g>
  </g>
</svg>